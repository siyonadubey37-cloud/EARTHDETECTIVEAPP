 const rows=[['Known trend +0.030 \u00b0C/yr, AR(1) noise',g(.03),.03],['Null: no trend, same noise',g(0),0]].map(t=>{const q=mk(t[1]),ci=t[2]>=q.corr.lo&&t[2]<=q.corr.hi,ok=t[2]?q.corr.p<.05&&ci:q.corr.p>=.05&&ci;
  return `<tr><td>${t[0]}</td><td>${t[2].toFixed(3)}</td><td>${q.sen.toFixed(3)} (${q.corr.lo.toFixed(3)} to ${q.corr.hi.toFixed(3)})</td><td class="${ok?'ok':'no'}">${ok?'PASS':'CHECK'}</td></tr>`}).join('');
 $('mbody').innerHTML=`<button class="x" onclick="$('modal').style.display='none'" aria-label="Close">&times;</button><div class="lb">How the detective works</div>
 <h3>Evidence</h3><p>Monthly 2 m air temperature (T2M, T2M_MAX, T2M_MIN) from the NASA POWER API, fetched live in your browser and cached locally. Each city's hot season is the 3 months with the highest 1985-2024 mean temperature. Globe colours show each year's departure from that city's 1985-94 average of the selected metric.</p>
 <h3>Verdict</h3><p>Mann-Kendall trend test with Sen's slope. The variance of S is inflated by (1+r1)/(1-r1) when lag-1 autocorrelation r1 of the detrended residuals is positive. Confidence intervals use that corrected variance. This is a lag-1 approximation, not full Hamed-Rao. Because 100 cities are tested together, p-values are adjusted with the Benjamini-Hochberg false-discovery procedure across all loaded cities (q). A "clear signal" needs q&lt;0.05. "Not clear yet" means the data cannot tell a real trend from yearly noise, not that nothing is happening. q values shift as more cities load.</p>
 <h3>Heat exposure index</h3><p><code>100 x clamp(0.5 x (Tmax_hot - 20)/20 + 0.5 x (Tmin_hot - 10)/20, 0, 1)</code> using 2020-24 means. A relative screening score, not a validated health model. The 2035 value extrapolates Sen slopes.</p>
 <h3>Self-test (seeded, live)</h3><table><tr><th>Test</th><th>True</th><th>Recovered (95% CI)</th><th>Result</th></tr>${rows}</table>
 <h3>Not included</h3><p>Numerical satellite land-surface temperature (ECOSTRESS, MODIS), NDVI and SEDAC population need NASA Earthdata access and are not used or simulated. MODIS daytime land-surface temperature appears only as a NASA GIBS picture in each case file. POWER describes the regional grid cell, not the street-level urban heat island. If data cannot be fetched or cached, Demo mode shows SYNTHETIC values that must not be cited.</p>
 <h3>Credit</h3><p>NASA Langley Research Center POWER Project (https://power.larc.nasa.gov/), data derived from MERRA-2 (NASA GMAO). Satellite pictures: NASA GIBS (MODIS/Terra). Earth textures: three.js examples.</p>`;$('modal').style.display='flex'}

async function auth(e){e.preventDefault();const u=$('au').value.trim(),p=$('ap').value,er=$('aerr');er.textContent='';
 if(!window.crypto||!crypto.subtle){er.textContent='Secure password storage is unavailable here. Please use guest access.';return}

 const key=u.toLowerCase(),U=users();
 if(mode==='reg'){if(U[key]){er.textContent='That username already exists on this device.';return}
  const salt=crypto.getRandomValues(new Uint8Array(16));U[key]={name:u,salt:b64(salt),h:await hash(p,salt)};
  try{localStorage.setItem('ed_users',JSON.stringify(U))}catch(x){er.textContent='Could not save the account (storage blocked). Use guest access.';return}}
 else{const r=U[key];if(!r){er.textContent='No such account on this device.';return}
  if(await hash(p,Uint8Array.from(atob(r.salt),c=>c.charCodeAt(0)))!==r.h){er.textContent='Wrong password.';return}}
 enter(U[key].name)}
